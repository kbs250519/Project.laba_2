<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form</title>
</head>
<body>
	<article>
            <h2>ЗАПОВНІТЬ ФОРМУ</h2>

            <form action="#" method="POST">
                <label for="username">Ваше ім'я:</label><br>
                <input type="text" id="username" name="username" placeholder="Уведіть ім'я..."><br><br>

                <label for="email">Уведіть вашу електронну адресу:</label><br>
                <input type="email" id="email" name="email" placeholder="Email..."><br><br>

                <label for="password">Пароль:</label><br>
                <input type="password" id="password" name="password" placeholder="Уведіть пароль..."><br><br>

                <label for="date">Уведіть вашу дату народження:</label><br>
                <input type="date" id="date" name="date"><br><br>

                <label for="number">Уведіть число:</label><br>
                <input type="number" id="number" name="number" placeholder="Уведіть число..."><br><br>

                <label for="checkbox">Оберіть варіант:</label><br>
                <select id="checkbox" name="checkbox">
                    <option value="1">Перший варіант</option>
                    <option value="2">Другий варіант</option>
                </select><br><br>

                <label for="radio">Оберіть ЛИШЕ варіант:</label><br>
                <select id="radio" name="radio">
                    <option value="1">Третій варіант</option>
                    <option value="2">Четвертий варіант</option>
                </select><br><br>

                <label for="skills">Вибери навички:</label><br>
                <select id="skills" name="skills" multiple size="3">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="js">JavaScript</option>
                </select><br><br>

                <label for="textarea">Повідомлення:</label><br>    
                <textarea id="textarea" name="textarea" placeholder="Впишіть текст..."></textarea><br><br>

                <button type="submit">ВІДПРАВИТИ</button>
            </form>
        </article>
</body>
</html>
